# HomeHub — intégration continue Android.
#
# À chaque push sur main (et sur demande manuelle) :
#   1. installe Java 17 et le SDK Android 35 ;
#   2. génère le Gradle wrapper s'il manque, puis le committe sur main ;
#   3. lance les tests unitaires (grammaire vocale) ;
#   4. compile les APK release du launcher TV et de la télécommande téléphone
#      (signées avec la clé de développement du dépôt), publiées en artefacts ;
#   5. si les secrets de signature sont configurés, produit aussi des APK
#      signées avec la clé de publication ;
#   6. sur main, met à jour la release « Dernière version » (liens directs).
#
# Secrets optionnels (Settings → Secrets and variables → Actions) :
#   HOMEHUB_KEYSTORE_BASE64   keystore .jks encodé en base64
#   HOMEHUB_KEYSTORE_PASSWORD mot de passe du keystore
#   HOMEHUB_KEY_ALIAS         alias de la clé
#   HOMEHUB_KEY_PASSWORD      mot de passe de la clé

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check relative links
        run: python3 .github/scripts/check_docs.py

  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_RELEASE_KEY: ${{ secrets.HOMEHUB_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          # Les images GitHub embarquent le SDK ; on installe les outils seulement s'ils manquent.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSfL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/clt"
            mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > "$RUNNER_TEMP/sdk.log" 2>&1 \
            || { echo "::error title=SDK Android::$(tail -n 20 "$RUNNER_TEMP/sdk.log" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper if missing
        id: wrapper
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Génération dans un dossier vide : ne dépend pas de la configuration du projet.
          tmp="$(mktemp -d)"
          (cd "$tmp" && touch settings.gradle && gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin)
          mkdir -p gradle/wrapper
          cp "$tmp/gradlew" "$tmp/gradlew.bat" .
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          chmod +x gradlew
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Commit Gradle wrapper
        if: steps.wrapper.outputs.generated == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          git commit -m "chore(build): ajoute le Gradle wrapper ${GRADLE_VERSION}"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Wrapper non poussé (branche modifiée entre-temps)."

      - name: Read version
        run: echo "VERSION_NAME=$(grep '^homehub.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Unit and contract tests
        run: |
          set -o pipefail
          ./gradlew :core:protocol:test :phone:intent:test :tv:testReleaseUnitTest --stacktrace 2>&1 | tee build.log
          # Résumé visible sur la page du build : nombre de tests réellement exécutés.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failures = 0
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
          print(f"### Tests unitaires : {total - failures}/{total} réussis\n")
          if total == 0:
              raise SystemExit("Aucun test exécuté")
          PY

      - name: Build release APKs (TV + téléphone)
        run: |
          set -o pipefail
          ./gradlew :tv:assembleRelease :phone:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Remonte les erreurs Gradle/Kotlin/tests en annotations, visibles sans ouvrir les logs.
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|What went wrong|^> |FAILURE|FAILED|Could not|Unresolved|Exception|AAPT|ERROR|expected" build.log \
            | grep -v "^\s*at " | awk '!seen[$0]++' | head -n 120 > errors.txt || true
          [ -s errors.txt ] || tail -n 60 build.log > errors.txt
          split -l 40 errors.txt part_
          for f in part_*; do
            echo "::error title=Build ${f#part_}::$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done

      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp tv/build/outputs/apk/release/tv-release.apk dist/HomeHub-TV.apk
          cp phone/build/outputs/apk/release/phone-release.apk dist/HomeHub-Remote.apk

      - name: Check APK size budgets
        run: |
          # Budgets : docs/architecture.md §11 (TV < 3 Mo, téléphone < 8 Mo).
          check() {
            size=$(stat -c %s "$1")
            echo "$1 : $((size / 1024)) Kio (budget $(( $2 / 1024 )) Kio)"
            echo "| $(basename "$1") | $((size / 1024)) Kio | $(( $2 / 1024 )) Kio |" >> sizes.md
            if [ "$size" -gt "$2" ]; then echo "::error title=Budget de taille::$1 dépasse le budget"; return 1; fi
          }
          echo "| APK | Taille | Budget |" > sizes.md
          echo "|---|---|---|" >> sizes.md
          check dist/HomeHub-TV.apk $((3 * 1024 * 1024))
          check dist/HomeHub-Remote.apk $((8 * 1024 * 1024))
          cat sizes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-release
          path: dist/HomeHub-TV.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-Remote
          path: dist/HomeHub-Remote.apk
          if-no-files-found: error
          retention-days: 90

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMEHUB_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homehub-release.jks"

      - name: Build signed release APKs
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          HOMEHUB_KEYSTORE_FILE: ${{ runner.temp }}/homehub-release.jks
          HOMEHUB_KEYSTORE_PASSWORD: ${{ secrets.HOMEHUB_KEYSTORE_PASSWORD }}
          HOMEHUB_KEY_ALIAS: ${{ secrets.HOMEHUB_KEY_ALIAS }}
          HOMEHUB_KEY_PASSWORD: ${{ secrets.HOMEHUB_KEY_PASSWORD }}
        run: |
          ./gradlew :tv:assembleRelease :phone:assembleRelease --stacktrace
          mkdir -p dist/signed
          cp tv/build/outputs/apk/release/tv-release.apk dist/signed/HomeHub-TV.apk
          cp phone/build/outputs/apk/release/phone-release.apk dist/signed/HomeHub-Remote.apk

      - name: Upload signed APK artifact
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-release-signed
          path: dist/signed/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove release keystore
        if: always() && env.HAS_RELEASE_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/homehub-release.jks"

      # Publication « Dernière version » : liens de téléchargement directs et stables
      # (…/releases/latest/download/HomeHub-Remote.apk), utilisés par le QR code de la TV.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/HomeHub-TV.apk dist/HomeHub-Remote.apk"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then files="dist/signed/HomeHub-TV.apk dist/signed/HomeHub-Remote.apk"; fi
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest $files \
            --target "$GITHUB_SHA" \
            --title "HomeHub ${VERSION_NAME} — build ${GITHUB_RUN_NUMBER}" \
            --latest \
            --notes "Dernière version compilée automatiquement depuis \`main\` ($(git rev-parse --short HEAD)).

          - **HomeHub-TV.apk** : le launcher, à installer sur la box Android TV (Send Files to TV).
          - **HomeHub-Remote.apk** : la télécommande, à installer sur le téléphone Android.

          Les deux applications sont signées avec la même clé : chaque nouvelle version s'installe par-dessus la précédente."

      - name: Job summary
        run: |
          {
            echo "## HomeHub ${VERSION_NAME} — build ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- Launcher TV : artefact \`HomeHub-release\` (HomeHub-TV.apk)"
            echo "- Télécommande téléphone : artefact \`HomeHub-Remote\` (HomeHub-Remote.apk)"
            echo ""
            echo "Téléchargement direct : https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
