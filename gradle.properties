# Version unique des deux applications (ADR-0010 : 0.n.0 pour la version Vn).
homehub.version=0.3.0-alpha.1

# Mémoire allouée au démon Gradle (Compose + R8 sont gourmands).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX uniquement, classes R non transitives (builds plus rapides).
android.useAndroidX=true
android.nonTransitiveRClass=true

# Style de code Kotlin officiel.
kotlin.code.style=official
